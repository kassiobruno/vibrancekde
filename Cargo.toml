[package]
name = "vibrance-kde"
version = "0.1.0"
edition = "2021"
description = "Digital vibrance automático por jogo para KDE Plasma 6 (Wayland)"
license = "GPL-3.0-only"
repository = "https://github.com/kassiobruno/vibrancekde"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
ksni = "0.3.7"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "process", "time", "signal", "io-util"] }
toml = "1.2.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
